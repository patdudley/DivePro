# Hourly daylight screenshot refresh for the DiveProSD homepage.
#
# This publishes fresh frames and records an image-only OpenAI pylon grade.
# It never couples that grade into forecasts or marks scheduled grading slots
# complete: the separate 8 AM / noon / 4 PM shadow pipeline is unchanged.
#
# Primary trigger is an external dispatcher (Cloudflare Worker) because
# GitHub throttles this repo's cron to roughly one run per 75-100 minutes.
# The cron lines below are best-effort backup only.
name: Scripps camera hourly refresh

on:
  workflow_dispatch:
  schedule:
    # Backup only; local daylight gating lives in the script (7 AM-6 PM PT).
    - cron: "17 14-23 * * *"
    - cron: "17 0-2 * * *"

permissions:
  contents: write

# Shares the graded workflow's group so latest.json writes serialize.
# cancel-in-progress stays false: an hourly refresh must never cancel a
# graded slot run mid-publish.
concurrency:
  group: scripps-camera-grade
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture dependencies
        run: |
          python -m pip install requests pillow playwright
          python -m playwright install --with-deps chromium

      - name: Read camera config
        id: config
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("camera-config.json").read_text())
          publish = bool(config.get("publish_screenshots", False))
          image_url = str(config.get("public_image_url", "")).strip()
          release_tag = str(config.get("public_image_release_tag", "")).strip()
          if not image_url or not release_tag:
              raise SystemExit("camera config requires public image URL and release tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if publish else 'false'}\n")
              output.write(f"public_image_url={image_url}\n")
              output.write(f"release_tag={release_tag}\n")
          PY

      - name: Capture display refresh frame
        id: capture
        if: steps.config.outputs.publish == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/scripps_camera.py --display-refresh \
            --public-image "$RUNNER_TEMP/scripps-pier.jpg" \
            --public-status "$RUNNER_TEMP/scripps-pier-latest.json" \
            --existing-status "camera-snapshots/scripps-pier-last-valid.json" \
            --public-image-url "${{ steps.config.outputs.public_image_url }}" \
            --openai-api-key "$OPENAI_API_KEY" \
            --openai-model "gpt-4.1-2025-04-14" \
            --reference-image "camera-reference/scripps-piling-distance-reference.png"
          if [ -s "$RUNNER_TEMP/scripps-pier-latest.json" ]; then
            echo "attempted=true" >> "$GITHUB_OUTPUT"
            capture_ok="$(python -c 'import json,os; print(str(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "scripps-pier-latest.json"))).get("capture_ok") is True).lower())')"
            echo "produced=$capture_ok" >> "$GITHUB_OUTPUT"
            grade_status="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "scripps-pier-latest.json"))).get("grade_status", "not_attempted"))')"
            echo "grade_status=$grade_status" >> "$GITHUB_OUTPUT"
          else
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "grade_status=not_attempted" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive validated capture
        id: archive
        if: steps.config.outputs.publish == 'true' && steps.capture.outputs.produced == 'true'
        run: |
          archive_path="$(python scripts/archive_scripps_capture.py \
            "$RUNNER_TEMP/scripps-pier.jpg" \
            "$RUNNER_TEMP/scripps-pier-latest.json")"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Commit immutable capture archive
        if: steps.archive.outputs.path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          archive_path="${{ steps.archive.outputs.path }}"
          git add "$archive_path" "${archive_path%.jpg}.json"
          git diff --cached --quiet && exit 0
          git commit -m "Archive Scripps camera capture"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Report hourly grade status
        if: steps.capture.outputs.attempted == 'true'
        run: |
          echo "OpenAI image grade: ${{ steps.capture.outputs.grade_status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.capture.outputs.grade_status }}" = "grading_skipped_missing_key" ]; then
            echo "OPENAI_API_KEY is not configured; screenshot publication continued." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Replace public latest-image release asset
        if: steps.config.outputs.publish == 'true' && steps.capture.outputs.produced == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.config.outputs.release_tag }}
        run: |
          image_url="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "scripps-pier-latest.json")))["image_url"] or "")')"
          if [ -z "$image_url" ] || [ ! -s "$RUNNER_TEMP/scripps-pier.jpg" ]; then
            echo "No new frame; keeping the previous public image asset"
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Latest Scripps camera observation" \
              --notes "Replace-in-place asset used by DiveProSD." --latest=false || \
              echo "release create failed (tag may already exist); continuing"
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          for attempt in 1 2 3; do
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/scripps-pier.jpg" --clobber && exit 0
            echo "release upload attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1

      - name: Commit public camera status pointers
        if: steps.config.outputs.publish == 'true' && steps.capture.outputs.attempted == 'true'
        run: |
          args=(
            --attempt "$RUNNER_TEMP/scripps-pier-latest.json"
            --attempt-destination camera-snapshots/scripps-pier-latest-attempt.json
            --last-valid-destination camera-snapshots/scripps-pier-last-valid.json
          )
          if [ -n "${{ steps.archive.outputs.path }}" ]; then
            args+=(
              --archive-path "${{ steps.archive.outputs.path }}"
              --legacy-destination camera-snapshots/scripps-pier-latest.json
            )
          fi
          python scripts/publish_scripps_status.py "${args[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camera-snapshots/scripps-pier-latest-attempt.json
          git add camera-snapshots/scripps-pier-last-valid.json
          git add camera-snapshots/scripps-pier-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Scripps camera status"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
