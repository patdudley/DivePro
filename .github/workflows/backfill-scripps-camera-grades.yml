name: Backfill Scripps camera grades

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Images to grade
        type: choice
        options:
          - latest
          - current_archive
          - owner_history
        default: latest

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install grader dependency
        run: python -m pip install requests

      - name: Grade archived Scripps images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          IMAGE_ARGS=()
          ARCHIVE_ROOT="camera-snapshot-history/scripps-pier"
          if [ "${{ inputs.scope }}" = "latest" ]; then
            latest_image="$(find camera-snapshot-history/scripps-pier -type f -name '*.jpg' | sort | tail -1)"
            test -n "$latest_image"
            IMAGE_ARGS+=(--image "$latest_image")
          elif [ "${{ inputs.scope }}" = "owner_history" ]; then
            mkdir -p "$RUNNER_TEMP/owner-history"
            git archive dbc37e8 camera-snapshot-history/scripps-pier \
              | tar -x -C "$RUNNER_TEMP/owner-history"
            ARCHIVE_ROOT="$RUNNER_TEMP/owner-history/camera-snapshot-history/scripps-pier"
          fi
          python scripts/backfill_openai_camera_grades.py \
            --archive-root "$ARCHIVE_ROOT" \
            --output-dir "$RUNNER_TEMP/scripps-camera-grades" \
            "${IMAGE_ARGS[@]}"

      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: scripps-camera-grade-backfill
          path: ${{ runner.temp }}/scripps-camera-grades/
          if-no-files-found: error
          retention-days: 30
